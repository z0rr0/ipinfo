# Specifies the configuration file format version.
# Version 2 is the current standard.
version: "2"

run:
    go: "1.27"
    timeout: 3m
    tests: false

linters:
    default: all
    disable:
        - depguard
        - err113
        # A major rename keeps the old name as a deprecated alias and ships the
        # new one as a separate linter, which `default: all` switches back on by
        # itself. Both names stay listed, as for wsl/wsl_v5 below.
        - exhaustruct
        - exhaustruct_v5
        - godox
        # Deprecated alias of gomodguard_v2; only the alias is disabled, to
        # silence its warning. gomodguard_v2 stays enabled and, with no
        # allow/block list configured, never fires — as gomodguard did before.
        - gomodguard
        - mnd
        - nilnil
        - nlreturn
        - varnamelen
        - promlinter
        - wrapcheck
        - wsl
        - wsl_v5
        - noinlineerr
    exclusions:
        generated: lax
        paths:
            - .coverage
            - docs
    settings:
        dupl:
            threshold: 120
        errcheck:
            check-blank: true
        govet:
            enable-all: true
        gocyclo:
            min-complexity: 20
        cyclop:
            max-complexity: 20
        lll:
            line-length: 160
        funlen:
            statements: 50
            lines: 150
        tagliatelle:
            case:
                rules:
                    json: snake
        depguard:
            rules:
                main:
                    deny:
                        - pkg: github.com/example/denied/pkg
                          desc: just because

output:
    formats:
        tab:
            path: stdout
            print-linter-name: true
            colors: true
