name: Go

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: "1.27.0"
                  cache: true

            - name: Check Go version
              run: go version

            - name: Test
              run: make gh

            - name: Run golangci-lint
              uses: golangci/golangci-lint-action@v9
              with:
                  version: v2.13.1
                  args: --config=golangci.yml --issues-exit-code=0

            - name: Run staticcheck
              uses: dominikh/staticcheck-action@v1
              with:
                  install-go: false
                  min-go-version: "1.27"

            # Not the securego/gosec docker action: it runs in a container with
            # its own Go (1.26.5 at the time of writing), while setup-go exports
            # GOTOOLCHAIN=local — so `go 1.27` in go.mod makes it fail to load the
            # packages. Running gosec with the Go installed above keeps a single
            # toolchain across every step, and pins it instead of tracking master.
            - name: Run Gosec Security Scanner
              run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 ./...

            - name: Run govulncheck
              uses: golang/govulncheck-action@v1
              with:
                  go-version-input: "1.27"
                  go-package: ./...
